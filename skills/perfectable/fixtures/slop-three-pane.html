<!DOCTYPE html>
<html>
<head>
  <title>Slop three pane</title>
  <style>
    .shell {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      padding: 16px;
      font-family: system-ui, sans-serif;
    }
    .card {
      padding: 16px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="card">Folders</section>
    <section class="card">Messages</section>
    <section class="card">Hello</section>
  </div>
</body>
</html>
