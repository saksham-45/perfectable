<!DOCTYPE html>
<html>
<head>
  <title>Slop editor</title>
  <style>
    .shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      font-family: Inter, sans-serif;
    }
    .titlebar { font-size: 17px; }
    .editor {
      backdrop-filter: blur(20px);
      background: #7c3aed;
    }
    .row {
      height: 28px;
      border-radius: 16px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="editor">
      <div class="titlebar">Untitled</div>
      <div class="row">File</div>
      <h1>Get Started</h1>
      <button class="rounded-full">Create project</button>
    </div>
  </div>
</body>
</html>
