<!DOCTYPE html>
<html>
<head>
  <title>Slop dashboard</title>
  <style>
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 16px;
      font-family: system-ui, sans-serif;
    }
    .metric-card {
      padding: 16px;
      border-radius: 12px;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="board">
    <section class="metric-card">12 Projects</section>
    <section class="metric-card">99 Uptime</section>
    <section class="metric-card">4 Alerts</section>
    <section class="metric-card">8k Spend</section>
  </div>
</body>
</html>
